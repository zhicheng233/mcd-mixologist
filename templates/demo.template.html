<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦门调酒师 · 今日特调</title>
<meta name="description" content="报一个心情，调一杯麦当劳。基于麦当劳中国 MCP 的今日特调 Skill。免安装、免 Token、可离线试算。">
<style>
  :root{
    --bg:#0f0c0a; --panel:#1a1512; --panel2:#221b16;
    --line:#33291f; --ink:#f4ece2; --dim:#a89a8b;
    --gold:#ffc72c; --red:#db0007; --ok:#7ddc7d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1100px 600px at 50% -10%,#2a1f16 0%,var(--bg) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh; padding:32px 18px 80px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  h1{font-size:30px;margin:0 0 8px;letter-spacing:.06em}
  h1 .em{color:var(--gold)}
  .sub{color:var(--dim);font-size:14px;line-height:1.7}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line); border-radius:18px; padding:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .label{font-size:12px;letter-spacing:.18em;color:var(--dim);margin:0 0 10px}
  .moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
  @media(max-width:560px){.moods{grid-template-columns:repeat(2,1fr)}}
  .mood{
    background:#14100d;border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px 8px;cursor:pointer;font-size:14px;
    transition:.16s; font-family:inherit;
  }
  .mood:hover{border-color:#5a4632;transform:translateY(-1px)}
  .mood[aria-pressed="true"]{background:var(--red);border-color:var(--red);font-weight:600}
  .mood small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
  .mood[aria-pressed="true"] small{color:#ffd9d9}
  .row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:20px}
  .row > div{flex:1;min-width:220px}
  input[type=range]{width:100%;accent-color:var(--gold)}
  .budget-val{color:var(--gold);font-weight:700;font-size:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:#14100d;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.16s;
  }
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:600}
  .go{
    width:100%;margin-top:6px;padding:16px;border-radius:14px;border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--gold),#e0a800);color:#1a1200;
    font-size:17px;font-weight:800;letter-spacing:.12em;font-family:inherit;
    transition:.16s;
  }
  .go:hover{filter:brightness(1.08)}
  .go:active{transform:scale(.99)}
  .results{margin-top:26px;display:grid;gap:16px}
  .recipe{
    background:linear-gradient(180deg,#1d1712,#171310);
    border:1px solid var(--line);border-radius:16px;padding:20px;
    position:relative;overflow:hidden;
  }
  .recipe.top{border-color:#5a4632;box-shadow:0 0 0 1px rgba(255,199,44,.14),0 14px 40px rgba(0,0,0,.4)}
  .recipe.top::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
  .rhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rname{font-size:20px;font-weight:800;letter-spacing:.04em}
  .rmatch{font-size:12px;color:var(--dim);letter-spacing:.1em}
  .rmatch b{color:var(--gold);font-size:15px}
  .opener{color:var(--dim);font-size:13px;margin:8px 0 14px;font-style:italic}
  .slot{display:flex;gap:12px;padding:9px 0;border-top:1px dashed #2b231b}
  .slot:first-of-type{border-top:0}
  .role{
    flex:0 0 42px;color:var(--gold);font-size:12px;letter-spacing:.14em;
    padding-top:3px;
  }
  .item{flex:1}
  .iname{font-weight:700;font-size:15px}
  .inote{color:var(--dim);font-size:12px;line-height:1.6;margin-top:3px}
  .sug .iname{color:var(--dim);font-weight:500}
  .flavors{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 10px;font-size:12px;color:var(--dim)}
  .flavors span{display:inline-flex;align-items:center;gap:8px}
  .fb{display:inline-flex;gap:3px}
  .fb i{display:block;width:8px;height:12px;border-radius:2px;background:#3a2f24}
  .fb i.on{background:var(--gold)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-bottom:12px}
  .meta b{color:var(--ink);font-size:15px}
  .note{
    background:#120f0c;border-left:2px solid var(--gold);border-radius:0 8px 8px 0;
    padding:10px 14px;font-size:13px;color:#e8dccb;line-height:1.7;
  }
  .note b{color:var(--gold);font-weight:600}
  .warn{color:#ffb4a2;font-size:12px;margin-top:8px}
  footer{margin-top:34px;text-align:center;color:#6d6157;font-size:12px;line-height:1.9}
  footer a{color:#8d7f72}
  .empty{color:var(--dim);text-align:center;padding:30px 0;font-size:14px}
  .notice{
    background:#241a10;border:1px solid #4a3a22;border-radius:12px;
    padding:12px 16px;font-size:13px;color:#e8dccb;line-height:1.7;
  }
  .notice b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍸 麦门<span class="em">调酒师</span></h1>
    <p class="sub">
      报一个心情，调一杯麦当劳。<br>
      基酒 · 辅料 · 调和 · 装饰，按你此刻的状态现场配。
    </p>
  </header>

  <div class="card">
    <p class="label">今天什么感觉</p>
    <div class="moods" id="moods"></div>

    <div class="row">
      <div>
        <p class="label">预算　<span class="budget-val" id="budgetVal">¥30</span></p>
        <input type="range" id="budget" min="18" max="70" step="1" value="30">
      </div>
      <div>
        <p class="label">还想来点</p>
        <div class="chips" id="cravings"></div>
      </div>
    </div>

    <div class="row">
      <div>
        <p class="label">餐段</p>
        <div class="chips" id="meals"></div>
      </div>
    </div>

    <button class="go" id="go">调 一 杯</button>
  </div>

  <div class="results" id="results"></div>

  <footer>
    麦当劳程序员创意开发大赛参赛作品 · 非麦当劳官方产品<br>
    本页为离线试算，使用内置风味库与历史价格快照，<b>不查询实时菜单、不核价、不下单</b>。<br>
    实际价格、供应状态与优惠以麦当劳官方渠道为准。本项目不含任何酒精饮品，"调酒"为风味搭配的隐喻。<br>
    <b>适配度</b>为引擎输出的相对评分，用于横向比较配方，不是概率，也不是营养或健康评分。<br>
    <a href="https://github.com/M-China/mcd-mcp-server">麦当劳 MCP 官方指南</a>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  "use strict";
  var DB = JSON.parse(document.getElementById("data").textContent);
  var DIMS = ["sweet","heat","umami","fresh","rich","warm"];
  var LABEL = {sweet:"甜",heat:"辣",umami:"咸鲜",fresh:"清爽",rich:"浓郁",warm:"温热"};
  var SLOT_W = {base:0.55, side:0.25, mixer:0.20};
  var SIM_FLOOR = 0.55, SIM_CEIL = 1.10, BUDGET_HARD = 1.45, AVOID_PENALTY = 0.35;

  var CRAVE = {
    "甜":   {sweet:0.35},
    "辣":   {heat:0.35},
    "清爽": {fresh:0.35, rich:-0.15},
    "清淡": {fresh:0.30, rich:-0.25, heat:-0.20},
    "浓":   {rich:0.30},
    "热":   {warm:0.30},
    "冰":   {warm:-0.35}
  };

  var MEALS = [
    {id:"lunch",   name:"午餐"},
    {id:"dinner",  name:"晚餐"},
    {id:"late-night", name:"夜宵"},
    {id:"breakfast",  name:"早餐"}
  ];

  var state = { mood:null, budget:30, meal:"dinner", cravings:{} };

  // ---------- 与 scripts/mix.py 完全一致的打分逻辑 ----------
  function sim(a,b){
    var d2 = 0;
    for (var i=0;i<DIMS.length;i++){
      var d = DIMS[i], x = (a[d]||0) - (b[d]||0);
      d2 += x*x;
    }
    return 1 - Math.sqrt(d2)/Math.sqrt(DIMS.length);
  }
  function calib(s){ return Math.max(0, Math.min(1, (s-SIM_FLOOR)/(SIM_CEIL-SIM_FLOOR))); }

  function blend(slots){
    var acc = {}, w = 0, k, i, d;
    for (d=0;d<DIMS.length;d++) acc[DIMS[d]] = 0;
    var order = ["base","side","mixer"];
    for (i=0;i<order.length;i++){
      k = order[i];
      if (!slots[k]) continue;
      var sw = SLOT_W[k]; w += sw;
      for (d=0;d<DIMS.length;d++) acc[DIMS[d]] += (slots[k].flavor[DIMS[d]]||0)*sw;
    }
    if (w>0) for (d=0;d<DIMS.length;d++) acc[DIMS[d]] = acc[DIMS[d]]/w;
    return acc;
  }

  function scoreCombo(slots, target, req){
    var flavor = blend(slots);
    var match = sim(flavor, target);
    var score = match;
    var price = 0, kcal = 0, tags = {}, k;
    for (k in slots){
      if (!slots[k]) continue;
      price += slots[k].price; kcal += slots[k].kcal;
      (slots[k].contains||[]).forEach(function(t){ tags[t]=1; });
    }
    for (var i=0;i<req.exclude.length;i++) if (tags[req.exclude[i]]) return null;

    var avoid = req.avoid || [], hit = 0;
    for (var j=0;j<avoid.length;j++) if (tags[avoid[j]]) hit++;
    if (hit) score -= 0.35 * hit;

    if (slots.side && slots.mixer) score += 0.07;
    else if (slots.side) score += 0.045;
    else if (slots.mixer) score += 0.025;
    if (slots.side && slots.side.role === "dessert") score -= 0.05;

    var wantWarm = target.warm || 0.5;
    if (wantWarm >= 0.75 && flavor.warm < 0.30) score -= 0.22;
    else if (wantWarm <= 0.35 && flavor.warm > 0.80) score -= 0.10;

    var warnings = [];
    if (req.cap != null && price > req.cap) return null;
    if (req.budget){
      if (price > req.budget){
        var over = price - req.budget;
        score -= Math.min(0.30, 0.5*over/Math.max(req.budget,1));
        warnings.push("超预算 ¥"+over.toFixed(1));
      } else if (price >= req.budget*0.55){
        score += 0.03;
      }
    }
    return {slots:slots, flavor:flavor, match:calib(match), fit:calib(score), score:score,
            price:Math.round(price*10)/10, kcal:kcal, warnings:warnings};
  }

  function buildBuckets(meal){
    var b = {base:[], side:[], mixer:[]};
    DB.flavor.items.forEach(function(it){
      if (it.period === "breakfast" && meal !== "breakfast") return;
      var role = it.role === "dessert" ? "side" : it.role;
      if (b[role]) b[role].push(it);
    });
    return b;
  }

  function applyCraving(target){
    var out = {};
    DIMS.forEach(function(d){ out[d] = target[d]||0; });
    Object.keys(state.cravings).forEach(function(word){
      if (!state.cravings[word]) return;
      var delta = CRAVE[word];
      if (!delta) return;
      Object.keys(delta).forEach(function(d){
        out[d] = Math.max(0, Math.min(1, out[d] + delta[d]));
      });
    });
    return out;
  }

  function mix(){
    var mood = DB.moods.filter(function(m){ return m.id === state.mood; })[0];
    if (!mood) return [];
    var target = applyCraving(mood.target);
    var buckets = buildBuckets(state.meal);
    var results = [];

    function collect(cap){
      var req = {budget: state.budget, cap: cap, exclude: [], avoid: mood.avoid || []};
      var out = [];
      buckets.base.forEach(function(base){
        var sides = [null].concat(buckets.side);
        var mixers = [null].concat(buckets.mixer);
        for (var i=0;i<sides.length;i++){
          for (var j=0;j<mixers.length;j++){
            var slots = {base:base};
            if (sides[i]) slots.side = sides[i];
            if (mixers[j]) slots.mixer = mixers[j];
            var r = scoreCombo(slots, target, req);
            if (r) out.push(r);
          }
        }
      });
      return out;
    }

    results = collect(state.budget);
    if (!results.length) results = collect(state.budget * BUDGET_HARD);

    results.sort(function(a,b){
      if (b.fit !== a.fit) return b.fit - a.fit;
      return b.score - a.score;
    });

    var picked = [], seenBase = {}, seenSide = {};
    for (var k=0;k<results.length && picked.length<3;k++){
      var r = results[k], bid = r.slots.base.id, sid = r.slots.side && r.slots.side.id;
      if (seenBase[bid] || (sid && seenSide[sid])) continue;
      seenBase[bid] = 1; if (sid) seenSide[sid] = 1;
      picked.push(r);
    }

    var usedSug = {};
    return picked.map(function(r, idx){
      var names = mood.names || [mood.name];
      var notes = mood.notes || [""];
      var openers = mood.openers || [""];
      var out = {
        name: names[idx % names.length],
        opener: openers[idx % openers.length],
        slots: r.slots, flavor: r.flavor, match: r.match, fit: r.fit,
        price: r.price, kcal: r.kcal, warnings: r.warnings,
        note: notes[idx % notes.length], suggestion: null
      };
      out.suggestion = suggestMissing(out, buckets, target, usedSug, state.budget, mood.avoid || []);
      if (out.suggestion) usedSug[out.suggestion.item.id] = 1;
      return out;
    });
  }

  function suggestMissing(recipe, buckets, target, used, budget, avoid){
    var slots = {};
    for (var k in recipe.slots) slots[k] = recipe.slots[k];
    var relax = {budget:null, cap: budget ? budget*1.35 : null, exclude:[], avoid: avoid || []};
    var pool = [];
    if (!slots.mixer) pool = buckets.mixer.map(function(m){ return [m,"mixer"]; });
    else if (!slots.side) pool = buckets.side.map(function(s){ return [s,"side"]; });
    else return null;

    var best = null;
    pool.forEach(function(pair){
      var item = pair[0], slot = pair[1];
      if (used[item.id]) return;
      var trial = {}; for (var k in slots) trial[k] = slots[k];
      trial[slot] = item;
      var r = scoreCombo(trial, target, relax);
      if (r && (!best || r.score > best.r.score)) best = {r:r, slot:slot, item:item};
    });
    if (!best) return null;
    var total = Math.round((recipe.price + best.item.price)*10)/10;
    return {
      slot: best.slot,
      label: best.slot === "mixer" ? "调和" : "辅料",
      item: best.item,
      match: best.r.match,
      delta: best.item.price,
      total: total,
      over: !!(budget && total > budget)
    };
  }

  // ---------- 渲染 ----------
  // 风味条用 CSS 画，不依赖 ▮▯ 字符的字体支持
  function bar(v){
    var n = Math.max(0, Math.min(5, Math.round(v*5)));
    var s = '<span class="fb">';
    for (var i=0;i<5;i++) s += '<i'+(i<n?' class="on"':'')+'></i>';
    return s + '</span>';
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function renderRecipe(r, idx){
    var h = '<div class="recipe'+(idx===0?" top":"")+'">';
    h += '<div class="rhead"><div class="rname">'+esc(r.name)+'</div>';
    h += '<div class="rmatch">适配度 <b>'+Math.round(r.fit*100)+'%</b></div></div>';
    if (r.opener) h += '<div class="opener">'+esc(r.opener)+'</div>';

    ["base","side","mixer"].forEach(function(slot){
      var it = r.slots[slot];
      if (!it) return;
      h += '<div class="slot"><div class="role">'+
           (slot==="base"?"基酒":slot==="side"?"辅料":"调和")+'</div><div class="item">'+
           '<div class="iname">'+esc(it.name)+'</div>'+
           '<div class="inote">'+esc(it.note)+'</div></div></div>';
    });

    if (r.suggestion){
      h += '<div class="slot sug"><div class="role">加配</div><div class="item">'+
           '<div class="iname">'+esc(r.suggestion.item.name)+'　+¥'+r.suggestion.delta.toFixed(1)+
           '（合计 ¥'+r.suggestion.total.toFixed(1)+(r.suggestion.over?'，超预算':'')+'）</div>'+
           '<div class="inote">可选。加不加都不影响上面这杯成立。</div></div></div>';
    }

    var f = r.flavor;
    h += '<div class="flavors">'+
         '<span>辣 '+bar(f.heat)+'</span>'+
         '<span>浓郁 '+bar(f.rich)+'</span>'+
         '<span>清爽 '+bar(f.fresh)+'</span>'+
         '<span>温热 '+bar(f.warm)+'</span>'+
         '</div>';
    h += '<div class="meta"><span>¥<b>'+r.price.toFixed(1)+'</b></span>'+
         '<span><b>'+r.kcal+'</b> kcal</span></div>';
    r.warnings.forEach(function(w){ h += '<div class="warn">⚠ '+esc(w)+'</div>'; });
    h += '<div class="note"><b>调酒师笔记：</b>'+esc(r.note)+'</div>';
    return h + '</div>';
  }

  function render(){
    var box = document.getElementById("results");
    if (!state.mood){ box.innerHTML = '<div class="empty">先选一个今天的心情。</div>'; return; }
    var list = mix();
    if (!list.length){ box.innerHTML = '<div class="empty">这个预算下没有能调的，把预算放宽一点试试。</div>'; return; }
    var head = "";
    if (list[0].fit < 0.40){
      head = '<div class="notice">预算 <b>¥'+state.budget+'</b> 能调的配方不多，'+
             '下面这几杯的适配度偏低——不是它们不好，是这个价位凑不出合你口味的组合。'+
             '把预算往上拉一点，可选的会多很多。</div>';
    }
    box.innerHTML = head + list.map(renderRecipe).join("");
  }

  // ---------- 交互 ----------
  function buildMoods(){
    var el = document.getElementById("moods");
    el.innerHTML = DB.moods.map(function(m){
      return '<button class="mood" data-mood="'+m.id+'" aria-pressed="false">'+
             esc(m.name)+'<small>'+esc((m.aliases||[]).slice(0,2).join(" / "))+'</small></button>';
    }).join("");
    el.addEventListener("click", function(e){
      var btn = e.target.closest(".mood");
      if (!btn) return;
      state.mood = btn.getAttribute("data-mood");
      Array.prototype.forEach.call(el.children, function(c){
        c.setAttribute("aria-pressed", c === btn ? "true" : "false");
      });
      render();
    });
  }

  function buildChips(){
    var el = document.getElementById("cravings");
    el.innerHTML = Object.keys(CRAVE).map(function(w){
      return '<button class="chip" data-crave="'+w+'" aria-pressed="false">'+w+'</button>';
    }).join("");
    el.addEventListener("click", function(e){
      var btn = e.target.closest(".chip");
      if (!btn) return;
      var w = btn.getAttribute("data-crave");
      state.cravings[w] = !state.cravings[w];
      btn.setAttribute("aria-pressed", state.cravings[w] ? "true" : "false");
      render();
    });

    var mel = document.getElementById("meals");
    mel.innerHTML = MEALS.map(function(m){
      return '<button class="chip" data-meal="'+m.id+'" aria-pressed="'+(m.id===state.meal)+'">'+m.name+'</button>';
    }).join("");
    mel.addEventListener("click", function(e){
      var btn = e.target.closest(".chip");
      if (!btn) return;
      state.meal = btn.getAttribute("data-meal");
      Array.prototype.forEach.call(mel.children, function(c){
        c.setAttribute("aria-pressed", c === btn ? "true" : "false");
      });
      render();
    });
  }

  function buildBudget(){
    var el = document.getElementById("budget");
    var out = document.getElementById("budgetVal");
    el.addEventListener("input", function(){
      state.budget = parseInt(el.value, 10);
      out.textContent = "¥" + state.budget;
      render();
    });
  }

  buildMoods(); buildChips(); buildBudget();
  state.mood = "tired";
  document.querySelector('.mood[data-mood="tired"]').setAttribute("aria-pressed","true");
  render();
  document.getElementById("go").addEventListener("click", render);
})();
</script>
</body>
</html>
